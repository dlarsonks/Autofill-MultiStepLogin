[versions]

activityKtx = "1.13.0"
androidx-activity-compose = "1.13.0"
appcompat = "1.8.0"
androidxComposeBom = "2026.09.00"
androidxTest = "1.7.0"
androidxTestJunit = "1.3.0"
browserVersion = "1.10.0"
cardview = "1.0.0"
commonsText = "1.15.0"
constraintlayout = "2.2.2"
credentialsVersion = "1.6.0"
daggerHiltVersion = "2.60.1"
datastorePreferences = "1.2.1"
fragmentKtx = "1.9.1"
gradle = "9.3.3"
junit = "4.13.2"
kotlin = "2.4.21"
ksp = "2.3.12"
material = "1.14.0"

[libraries]
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browserVersion" }
androidx-cardview = { group = "androidx.cardview", name = "cardview", version.ref = "cardview" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
apache-commons-text = { group = "org.apache.commons", name = "commons-text", version.ref = "commonsText" }
credentials = { module = "androidx.credentials:credentials", version.ref = "credentialsVersion" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
gradle = { module = "com.android.tools.build:gradle", version.ref = "gradle" }
gradle-hilt = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "daggerHiltVersion" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "daggerHiltVersion" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "daggerHiltVersion" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
